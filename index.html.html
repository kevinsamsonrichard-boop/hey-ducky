const SCENE_COUNT = 11;
const GIFT_SCENE = 10;
function freshState(){ return {scene:0,step:0,visited:0,openedStars:[],giftOpened:false,giftPermission:false,hiddenDuck:0}; }
function normalizeState(value){
  const s=freshState();
  if(!value || typeof value!=='object') return s;
  s.scene=Number.isInteger(value.scene)?Math.max(0,Math.min(SCENE_COUNT-1,value.scene)):0;
  s.visited=Number.isInteger(value.visited)?Math.max(s.scene,Math.min(SCENE_COUNT-1,value.visited)):s.scene;
  const limits=[1,0,0,0,4,1,3,6,4,7,7];
  s.step=Number.isInteger(value.step)?Math.max(0,Math.min(limits[s.scene],value.step)):0;
  s.openedStars=Array.isArray(value.openedStars)?[...new Set(value.openedStars.filter(n=>Number.isInteger(n)&&n>=0&&n<16))]:[];
  s.giftPermission=value.giftPermission===true;
  s.giftOpened=value.giftOpened===true && s.giftPermission;
  if(s.scene===GIFT_SCENE){ if(s.step>=3 && !s.giftOpened)s.step=s.giftPermission?2:0; if(s.step>=2&&!s.giftPermission)s.step=0; }
  s.hiddenDuck=Number.isInteger(value.hiddenDuck)?Math.max(0,Math.min(3,value.hiddenDuck)):0;
  return s;
}
function goTo(s,scene){ if(!Number.isInteger(scene)||scene<0||scene>=SCENE_COUNT)return s; return {...s,scene,step:0,visited:Math.max(s.visited,scene)}; }
function openGift(s){ return s.scene===GIFT_SCENE&&s.giftPermission&&s.step===2?{...s,giftOpened:true,step:3}:s; }
function grantGiftPermission(s){ return s.scene===GIFT_SCENE&&s.step===1?{...s,giftPermission:true,step:2}:s; }

// Original synthesised night ambience. No remote music, microphone, or autoplay.
class NightAudio {
  constructor(){this.context=null;this.master=null;this.on=false;this.nodes=[];}
  async toggle(){
    if(this.on){this.off();return false;}
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)throw new Error('Sound is unavailable in this browser. The whole journey still works silently.');
    if(!this.context){
      this.context=new AudioContext(); this.master=this.context.createGain();this.master.gain.value=0;this.master.connect(this.context.destination);
      const count=this.context.sampleRate*4,buffer=this.context.createBuffer(1,count,this.context.sampleRate),data=buffer.getChannelData(0);let last=0;
      for(let i=0;i<count;i++){last=(last+Math.random()*0.04-0.02)/1.02;data[i]=last;}
      const wind=this.context.createBufferSource();wind.buffer=buffer;wind.loop=true;
      const filter=this.context.createBiquadFilter();filter.type='lowpass';filter.frequency.value=550;wind.connect(filter);filter.connect(this.master);wind.start();this.nodes.push(wind);
      for(const f of [130.81,196,261.63]){const o=this.context.createOscillator(),g=this.context.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.017;o.connect(g);g.connect(this.master);o.start();this.nodes.push(o);}
    }
    await this.context.resume();this.master.gain.cancelScheduledValues(this.context.currentTime);this.master.gain.setTargetAtTime(0.22,this.context.currentTime,0.4);this.on=true;return true;
  }
  off(){if(this.context){this.master.gain.cancelScheduledValues(this.context.currentTime);this.master.gain.setTargetAtTime(0,this.context.currentTime,0.12);}this.on=false;}
  chime(){if(!this.on||!this.context)return;const o=this.context.createOscillator(),g=this.context.createGain();o.frequency.value=783.99;g.gain.setValueAtTime(0.025,this.context.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.context.currentTime+0.65);o.connect(g);g.connect(this.master);o.start();o.stop(this.context.currentTime+0.7);}
  beat(){if(!this.on||!this.context)return;const o=this.context.createOscillator(),g=this.context.createGain();o.frequency.setValueAtTime(110,this.context.currentTime);o.frequency.exponentialRampToValueAtTime(48,this.context.currentTime+0.12);g.gain.setValueAtTime(0.1,this.context.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.context.currentTime+0.2);o.connect(g);g.connect(this.master);o.start();o.stop(this.context.currentTime+0.25);}
}

const lineDots=(n,active)=>`<div class="line-counter" aria-hidden="true">${Array.from({length:n},(_,i)=>`<span class="${i===active?'active':''}"></span>`).join('')}</div>`;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{}}
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];clearInterval(danceInterval);document.querySelectorAll('.confetti,.shooting-star,.lake-ripple').forEach(el=>el.remove());}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),4200);}
function note(title,body,kicker='A little note'){ $('#note-kicker').textContent=kicker;$('#note-title').textContent=title;$('#note-body').replaceChildren();const p=document.createElement('p');p.textContent=body;$('#note-body').append(p);if(!$('#note-dialog').open)$('#note-dialog').showModal();audio.chime(); }
function next(){state=goTo(state,Math.min(10,state.scene+1));render();}
function step(){state.step++;render();}
function ambience(){const on=audio.on;$('#sound').setAttribute('aria-pressed',String(on));$('#sound').setAttribute('aria-label',on?'Turn sound off':'Turn sound on');$('#sound-label').textContent=on?'Sound on':'Sound off';}
async function toggleSound(){try{await audio.toggle();soundChosen=true;ambience();toast(audio.on?'A little night sound. Nothing to do. Just listen.':'Quiet is lovely, too.');}catch(e){toast(e.message);}}
function render({focus=true}={}){
  clearTimers();save();document.body.className=`${[3,8,9].includes(state.scene)?'landscape-visible ':''}${state.scene===8?'scene-climb ':''}${state.scene===9?'scene-birthday ':''}`;
  document.body.style.setProperty('--zoom',String(1+state.step*.025));
  const screens=[intro,giftReminder,chaos,lake,constellation,profile,dance,personal,climb,october,gift];scene.innerHTML=screens[state.scene]();
  $('#back').hidden=state.scene===0;$('#chapter').textContent=chapters[state.scene];
  $('#progress').innerHTML=chapters.map((_,i)=>`<i class="${i===state.scene?'current':i<state.scene?'done':''}"></i>`).join('');$('#progress').setAttribute('aria-label',`Scene ${state.scene+1} of ${chapters.length}`);
  $('#moon').hidden=[2,5,6,10].includes(state.scene);
  if(focus){window.scrollTo({top:0,behavior:'instant'});const heading=scene.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}
  if(state.scene===6 && state.step>0){startDance();}
  if(state.scene===9 && state.step===0){const star=document.createElement('div');star.className='shooting-star';document.body.append(star);later(()=>star.remove(),2100);}
}
function intro(){return `<section class="scene-inner center intro">${eyebrow('A small corner of the universe')}<h1>${state.step===0?'Hey, <span class="title-accent">Ducky.</span>':'Don’t rush.'}</h1>${state.step===0?`<p class="lead">Before you enter…<br>there’s one rule.</p><div class="actions">${button('What?','intro-rule')}</div><p class="small-note">Made for a little curiosity.</p>`:`<p class="lead">There’s nothing you need to finish here.<br>Just take your time.</p><div class="actions">${button('Okayyy.','next')}</div><p class="small-note" id="sound-invite">This world has a little night sound. Turn it on?</p><div class="actions" style="margin-top:6px">${button('Sound on','sound','text-button')}${button('Maybe later','sound-later','text-button')}</div>`}<div class="intro-decoration">${duck('intro-duck')}</div></section>`;}
function giftReminder(){return `<section class="scene-inner center">${eyebrow('Before we wander')}<div class="gift-note"><h2>One tiny thing.</h2><p>That thing I gave you…<br>I hope you haven’t opened it already.</p><p>Keep it close. Keep it closed.<span class="line-break" style="color:var(--amber)">I’ll tell you when.</span></p><div class="actions left">${button('Okay, keeping it closed.','sealed')}</div></div><p class="small-note">Patience. There’s a reason.</p></section>`;}
function chaos(){return `<section class="scene-inner chaos-layout"><div class="chaos-copy">${eyebrow('Some things never change')}<h2 class="chaos-title">A familiar<br>kind of <span class="title-accent">chaos.</span></h2><p class="lead left">You thought this would be a peaceful website.<br>Unfortunately, I know your number.</p><div class="actions left">${button('ESCAPE KEVIN','escape')}</div><p class="small-note">No tasks need completing. Especially these.</p></div><div class="notification-stack">${notifications.map((n,i)=>`<article class="notification"><div class="notification-top"><strong>${n.from}</strong><span>${n.time}</span></div><h3>${n.title}</h3><p>${n.text}</p><button class="notification-action" data-action="notification" data-index="${i}">${n.action}</button></article>`).join('')}</div></section>`;}
function lake(){return `<section class="scene-inner lake-layout">${eyebrow('Somewhere quieter')}<h2>If the world ever<br>gets too <span class="title-accent">loud…</span></h2><p class="lead" id="lake-whisper">…I hope you always find your Chandratal.</p><div class="lake-control-row"><button class="lake-control" data-action="fire"><span class="icon" aria-hidden="true">♨</span>A little fire</button><button class="lake-control" data-action="chai"><span class="icon" aria-hidden="true">☕</span>Some chai</button><button class="lake-control" data-action="silence">Suspicious silence…</button></div><p class="ripple-hint">Touch the lake. Let the ripples wander.</p><div class="actions">${button('A little further','next','secondary')}</div>${duck('lake-duck','lake-duck')}</section>`;}

function constellation(){return `<section class="scene-inner constellation-layout"><div class="constellation-copy">${eyebrow('Little things, noticed')}<h2>You said<br>“not even <span class="title-accent">ten.</span>”</h2><p class="lead left">I remember.<br>Here are a few little reminders.</p>${state.step>0?`<div class="count-display" id="count-display">200</div><p class="small-note" id="count-note">Yeah. I stopped counting.</p>`:`<div class="actions left">${button('Still think there aren’t even 10?','count','secondary')}</div>`}<div class="actions left">${button('Keep wandering','next')}</div><p class="small-note">You can open one star or all of them.</p></div><div style="width:100%;min-width:0"><div class="constellation-map" aria-label="Sixteen little things Kevin appreciates about you">${reasons.map(([title],i)=>`<button class="constellation-star ${state.openedStars.includes(i)?'opened':''}" style="left:${starPositions[i][0]}%;top:${starPositions[i][1]}%" data-action="star" data-index="${i}" aria-label="Open star: ${esc(title)}" aria-pressed="${state.openedStars.includes(i)}"><span aria-hidden="true">${i%3===0?'✦':'✧'}</span>${i===0||i===3||i===10?`<span class="star-label" aria-hidden="true">${['a little memory','a little truth','a little smile'][[0,3,10].indexOf(i)]}</span>`:''}</button>`).join('')}</div><p class="constellation-caption">Every little light has something to say.</p></div></section>`;}

function personal(){const [title,body]=personalLines[Math.min(state.step,6)];return `<section class="scene-inner personal-layout">${eyebrow('Beneath the nonsense')}<h2>${title}</h2>${body?`<p class="lead">${body}</p>`:''}${lineDots(7,state.step)}<div class="actions">${button(state.step<6?'Go on.':'A little further?','personal-next')}</div></section>`;}
function climb(){const [title,body]=climbLines[Math.min(state.step,4)];return `<section class="scene-inner personal-layout" id="climb-view"><div class="text-content">${eyebrow('A little higher')}<h2>${title}</h2><p class="lead">${body}</p></div>${lineDots(5,state.step)}<div class="actions">${state.step===4?`${button('Stay a moment','stay','secondary')}${button('Continue','next')}`:button(state.step===0?'Let’s go.':'A little higher','climb-next')}</div></section>`;}
function october(){const [title,body]=octoberLines[Math.min(state.step,7)];return `<section class="scene-inner october-layout">${eyebrow(state.step<4?'A little October magic':'For your new year')}<h2>${title}</h2>${body?`<p class="${state.step===4?'birthday-date':'lead'}">${body}</p>`:''}${lineDots(8,state.step)}<div class="actions">${button(state.step===3?'11 October.':state.step===7?'One last thing.':'Go on.','october-next')}</div></section>`;}
function clock(){return `<div class="clock" role="img" aria-label="A clock reaching twelve"><span class="twelve">12</span>${Array.from({length:11},(_,i)=>`<span class="tick" style="--a:${(i+1)*30}deg"></span>`).join('')}<span class="hand"></span><span class="hand minute"></span></div>`;}

    case 'next':next();break;
    case 'sealed':next();toast('Remarkable. Following instructions already.');break;
    case 'sound':await toggleSound();if($('#sound-invite'))$('#sound-invite').textContent=audio.on?'A little night sound. You can switch it off any time.':'We’ll keep it quiet.';break;
    case 'sound-later':audio.off();ambience();soundChosen=true;$('#sound-invite').textContent='Quiet is lovely, too.';break;
    case 'intro-duck':toast('Already getting distracted. Excellent.');break;
    case 'notification':{const n=notifications[Number(el.dataset.index)];note(n.action,n.reply,'Kevin, naturally');el.textContent='Seen. Unfortunately.';break;}
    case 'escape':el.disabled=true;toast('Your request for peace has been approved. Kevin was not consulted.');scene.style.opacity='0';later(()=>{scene.style.opacity='';next();},450);break;
    case 'fire':$('#lake-whisper').textContent='A little fire. The wood. The wind. The water.';audio.chime();break;
    case 'chai':$('#lake-whisper').textContent='Some chai. A ridiculous sky. No urgent meetings.';audio.chime();break;
    case 'silence':note('Except maybe me.','But I can wait.','Absolutely nobody asking you to reply immediately');break;
    case 'lake-duck':duckClicks++;toast(['Yes. There’s a duck.','Stop bullying the duck.','I know exactly who taught you this behaviour.'][Math.min(duckClicks-1,2)]);break;
    case 'count':countReasons(el);break;
    case 'star':{const i=Number(el.dataset.index);if(!state.openedStars.includes(i))state.openedStars.push(i);save();el.classList.add('opened');el.setAttribute('aria-pressed','true');note(reasons[i][0],reasons[i][1],'Little things, noticed');break;}
    case 'scan':note('Quick check complete.','Patience with Kevin: unexpectedly high.\nAbility to derail a conversation: excellent.\nEstimated awesomeness: calculator unavailable.','Entirely unbiased');break;
    case 'object':toast('Your objection has been recorded. And respectfully ignored.');break;
    case 'general':toast('Yes. Generally. Some things are never being forgotten.');break;
    case 'yeah':el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce');toast('Yeah, yeah. I can hear the accent from here.');break;
    case 'dance':if(state.step<3){state.step++;render();if(state.step===1)confetti();}else{confetti();toast('Fine. One more little dance.');}break;
    case 'personal-next':state.step<6?step():next();break;
    case 'climb-next':step();break;
    case 'stay':$('#climb-view').classList.toggle('quiet-view');el.textContent=$('#climb-view').classList.contains('quiet-view')?'Bring the words back':'Stay a moment';break;
    case 'october-next':state.step<7?step():next();break;
    case 'gift-next':if(state.step===0)step();else if(state.step===1){state=grantGiftPermission(state);render();}else if(state.step===2){state=openGift(state);render();}else if(state.step<6)step();break;
    case 'back-lake':state=goTo(state,3);render();break;
    case 'final-duck':state.hiddenDuck=Math.min(3,state.hiddenDuck+1);save();note(['You thought that was it?','A final little thing.','You do.'][state.hiddenDuck-1],['There’s one more tiny note. Tap the duck again whenever you’re ready.','For all the times you’ve wondered whether you matter more than you realise…','That’s enough.'][state.hiddenDuck-1],'A tiny duck, a tiny truth');if(state.hiddenDuck===3)$('#note-body').replaceChildren();break;
  }
});
function countReasons(el){el.disabled=true;state.step=4;save();const box=document.createElement('div');box.className='count-display';box.setAttribute('aria-label','Two hundred');el.closest('.actions').replaceWith(box);const sub=document.createElement('p');sub.className='small-note';box.after(sub);const values=[10,20,50,122,200];values.forEach((n,i)=>later(()=>{box.textContent=n;if(i===4)sub.textContent='Yeah. I stopped counting.';},i*270));}
function startDance(){let beats=0;danceInterval=setInterval(()=>{if(document.hidden)return;audio.beat();beats++;if(beats===12){clearInterval(danceInterval);}},550);}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<20;i++){const p=document.createElement('i');p.className='confetti';p.style.setProperty('--x',`${Math.random()*100}%`);p.style.setProperty('--d',`${2+Math.random()*2}s`);p.style.setProperty('--c',['#eac698','#b1a4d0','#b3c7de'][i%3]);document.body.append(p);later(()=>p.remove(),4100);}}
scene.addEventListener('pointerdown',e=>{if(state.scene!==3||e.target.closest('button'))return;const r=document.createElement('div');r.className='lake-ripple';r.style.left=`${e.clientX-20}px`;r.style.top=`${e.clientY-7}px`;document.body.append(r);later(()=>r.remove(),1350);});
function journey(){const nav=$('#journey-links');nav.innerHTML=chapters.slice(0,state.visited+1).map((title,i)=>`<button data-scene="${i}" class="${i===state.scene?'active':''}">${String(i+1).padStart(2,'0')} · ${title}</button>`).join('');$('#journey-dialog').showModal();}
$('#journey-links').addEventListener('click',e=>{const b=e.target.closest('[data-scene]');if(!b)return;state=goTo(state,Number(b.dataset.scene));$('#journey-dialog').close();render();});
$('#home').addEventListener('click',journey);$('#menu').addEventListener('click',journey);
$('#sound').addEventListener('click',toggleSound);$('#back').addEventListener('click',()=>{state=goTo(state,state.scene-1);render();});
$('#moon').addEventListener('click',()=>note('A little moon note.','You’re probably reading this while I’m wondering whether you’ve reached this part yet.\n\nAnyway… keep going.','Same sky, different thoughts'));
$('#close-note').addEventListener('click',()=>$('#note-dialog').close());$('#note-okay').addEventListener('click',()=>$('#note-dialog').close());$('#close-journey').addEventListener('click',()=>$('#journey-dialog').close());
$('#restart').addEventListener('click',()=>{state=freshState();duckClicks=0;$('#journey-dialog').close();render();toast('A fresh little beginning. Your gift can stay open, of course.');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&audio.on){audio.off();ambience();}});
window.addEventListener('pagehide',()=>audio.off());
// Deterministic positions avoid layout jumps, and keep the star field lightweight.
for(let i=0;i<65;i++){const star=document.createElement('i');star.style.left=`${(i*37.7)%100}%`;star.style.top=`${(i*19.3)%96}%`;star.style.setProperty('--o',String(.18+(i%5)*.11));star.style.setProperty('--d',`${4+i%6}s`);$('#stars').append(star);}
render({focus:false});
if(state.scene>0)toast('Welcome back. Right where you left your little world.');
</script>
</body>
</html>
